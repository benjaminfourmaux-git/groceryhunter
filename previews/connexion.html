*{box-sizing:border-box}body{margin:0;background:#dce4e0;color:var(--ink);font-family:'Zen Maru Gothic',sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:3px solid var(--green);outline-offset:4px}button:disabled{opacity:.65;cursor:default}.reviewbar{display:flex;align-items:center;justify-content:space-between;gap:20px;max-width:1060px;margin:0 auto;padding:26px 30px;color:#2a3a34}.reviewbar strong{display:block;font-size:14px}.reviewbar small{color:#5c6b62;font-size:12px}.theme-switch{display:flex;background:#fdfbf5;border-radius:999px;padding:4px;gap:3px}.theme-switch button{border:0;background:none;border-radius:999px;padding:9px 16px;font-size:12px;color:#5c6b62}.theme-switch button[aria-pressed=true]{background:#3e7a46;color:#fdfbf5}main{display:grid;grid-template-columns:330px 394px;gap:100px;align-items:center;justify-content:center;min-height:calc(100vh - 100px);padding:15px 28px 55px}.notes .kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#3e7a46}.notes h1{font-family:'Klee One',serif;font-size:48px;line-height:1.12;font-weight:600;margin:14px 0 22px;color:#2a3a34}.notes p{font-size:14px;line-height:1.8;color:#5c6b62}.notes a{display:inline-flex;align-items:center;gap:8px;margin-top:20px;font-size:13px;font-weight:700;color:#3e7a46;text-underline-offset:5px}.phone{position:relative;width:394px;min-height:820px;overflow:hidden;border-radius:40px;background:var(--ground);box-shadow:0 24px 80px rgba(38,61,57,.17),0 0 0 7px rgba(253,251,245,.45);isolation:isolate}.sky{position:absolute;inset:0 0 auto;height:330px;background:var(--sky);z-index:-1;overflow:hidden}.clouds{position:absolute;inset:0;width:100%;height:100%}.cloud-drift{animation:cloud-drift 75s linear infinite alternate}.day{display:initial}.night{display:none}[data-theme=dark] .day{display:none}[data-theme=dark] .night{display:initial}@keyframes cloud-drift{from{transform:translateX(-14px)}to{transform:translateX(24px)}}.topline{height:68px;display:flex;align-items:center;justify-content:space-between;padding:20px 25px 0}.wordmark{font-size:13px;font-weight:700;letter-spacing:.03em}.lang{border:0;background:var(--paper);color:var(--ink);display:flex;gap:7px;align-items:center;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:700;box-shadow:0 2px 8px rgba(42,58,52,.06)}.flag{width:18px;height:18px;border-radius:50%;background:linear-gradient(90deg,#0055a4 33%,#fff 33%,#fff 66%,#ef4135 66%);overflow:hidden}.hero{text-align:center;padding:17px 24px 0}.basket{width:66px;height:60px;display:block;margin:0 auto 14px}.hero h2{font-family:'Klee One',serif;font-size:30px;font-weight:600;line-height:1.22;margin:0 0 12px;letter-spacing:-.035em}.hero p{font-size:14px;line-height:1.65;margin:0 auto;max-width:290px}.card{position:relative;margin:27px 22px 0;padding:8px 22px 24px;background:var(--paper);border-radius:28px;box-shadow:var(--shadow);z-index:2}.tabs{display:flex;margin:14px 0 21px;padding:4px;gap:4px;background:var(--field);border-radius:999px}.tabs button{position:relative;flex:1;padding:11px 6px;border:0;border-radius:999px;font-size:13px;font-weight:700;background:transparent;color:var(--muted);transition:color .2s,background .2s,box-shadow .2s}.tabs button[aria-selected=true]{background:var(--paper);color:var(--ink);box-shadow:0 2px 8px rgba(42,58,52,.09)}label{display:block;font-size:12px;font-weight:700;margin:0 0 8px}label .optional{font-size:11px;color:var(--muted);font-weight:400}.field{margin-bottom:17px}input{display:block;width:100%;border:1px solid transparent;background:var(--field);border-radius:16px;min-height:52px;padding:13px 15px;color:var(--ink);font-size:16px;outline:none;transition:box-shadow .2s,border-color .2s}input::placeholder{color:var(--muted);opacity:1}input:focus{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 15%,transparent)}.primary{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:53px;border:0;border-radius:999px;margin-top:23px;background:var(--green);color:var(--on-green);font-weight:700;font-size:14px;box-shadow:0 7px 16px rgba(62,122,70,.14);transition:transform .2s}.primary:active{transform:scale(.975)}.hint{font-size:11px;line-height:1.6;text-align:center;color:var(--muted);margin:14px 3px 0}.reassure{font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;margin:21px 0 70px;position:relative;z-index:2}.meadow{position:absolute;bottom:-1px;left:0;width:100%;height:115px;z-index:0;pointer-events:none}.code{text-transform:uppercase;letter-spacing:.22em;text-align:center}.panel{animation:arrive .25s ease-out}@keyframes arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.toast{position:absolute;left:24px;right:24px;bottom:30px;border-radius:18px;background:var(--ink);color:var(--paper);padding:12px 16px;text-align:center;font-size:12px;z-index:8;box-shadow:var(--shadow)}[hidden]{display:none!important}@media(min-width:761px) and (max-height:960px){.phone{min-height:780px}.topline{height:57px}.hero{padding-top:8px}.basket{width:65px;height:61px;margin-bottom:11px}.hero h2{font-size:30px}.card{margin-top:23px}.reviewbar{padding-top:18px;padding-bottom:10px}main{padding-top:12px;gap:80px}}@media(max-width:760px){body{background:var(--ground)}.reviewbar{padding:12px 16px;color:var(--ink)}.reviewbar strong{font-size:11px}.reviewbar small{display:none}.theme-switch button{padding:7px 12px}main{display:block;min-height:0;padding:0}.notes{display:none}.phone{width:100%;max-width:430px;margin:auto;min-height:calc(100svh - 60px);border-radius:0;box-shadow:none}.topline{height:60px}.hero{padding-top:5px}.basket{width:65px;height:61px;margin-bottom:9px}.hero h2{font-size:30px}.card{margin-top:23px}.sky{height:305px}.reassure{margin-bottom:82px}}@media(prefers-reduced-motion:reduce){*,* /* Aperçu de l'écran seul, sans habillage de présentation. */
body { background: var(--ground); }
main { display: flex; justify-content: center; align-items: stretch; padding: 0; }
.phone { width: 100%; max-width: 430px; border-radius: 0; box-shadow: none; }
/* Cible iPhone : un écran fixe, composé pour la hauteur réellement disponible. */
html, body { height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; }
body { display: flex; flex-direction: column; }
.reviewbar { flex: none; width: 100%; }
main { flex: 1; min-height: 0; overflow: hidden; padding-bottom: 0; }
.phone { height: 100%; min-height: 0; max-height: none; container-type: size; display: flex; flex-direction: column; }
.topline, .hero, .card { flex: none; }
.reassure { margin: 18px 0 0; }
.meadow { height: 70px; }
@media(max-width:760px) {
  .reviewbar { height: calc(52px + env(safe-area-inset-top, 0px)); padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 8px; }
  main { flex: 1; min-height: 0; padding: 0; display: flex; }
  .phone { flex: 1; height: 100%; min-height: 0; max-height: none; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .reassure { margin: 16px 0 0; }
  .meadow { height: calc(55px + env(safe-area-inset-bottom, 0px)); }
}
@container (max-height: 760px) {

<script>
const copy={fr:{title:'Les courses,<br>en bonne compagnie.',intro:'Ce qui manque à la maison,<br>sur une seule et même liste.',createTab:'Créer un foyer',joinTab:'Rejoindre',firstLabel:'Ton prénom',reassure:'Juste un prénom. Aucun mot de passe.',createLabel:'Nom du foyer <span class="optional">(facultatif)</span>',joinLabel:'Code du foyer',createCta:'Créer mon foyer',joinCta:'Rejoindre le foyer',createHint:'Un petit code à partager,<br>et toute la maison te rejoint.',joinHint:'Demande le code à une personne<br>déjà dans le foyer.',createPh:'Ex. À la maison',joinPh:'Ex. K7M2QP',demo:'Ceci est un aperçu : aucun foyer n’a été créé.'},en:{title:'Shopping feels<br>better together.',intro:'Everything your home needs,<br>on one shared list.',createTab:'Create a home',joinTab:'Join a home',firstLabel:'Your first name',reassure:'Just a first name. No password.',createLabel:'Home name <span class="optional">(optional)</span>',joinLabel:'Home code',createCta:'Create my home',joinCta:'Join the home',createHint:'Share a little code,<br>and everyone is welcome.',joinHint:'Ask someone already in the home<br>for their invitation code.',createPh:'E.g. Our place',joinPh:'E.g. K7M2QP',demo:'This is a preview: no home has been created.'}};
const systemTheme=matchMedia('(prefers-color-scheme: dark)');
function syncTheme(){document.documentElement.dataset.theme=systemTheme.matches?'dark':'light';}
syncTheme();systemTheme.addEventListener('change',syncTheme);
let lang='fr',mode='join',toastTimer;const field=document.querySelector('#home');const fields={create:'',join:''};
function render(){const c=copy[lang];document.documentElement.lang=lang;document.querySelectorAll('[data-copy]').forEach(e=>e.innerHTML=c[e.dataset.copy]);document.querySelector('#home-label').innerHTML=c[mode+'Label'];document.querySelector('#cta-text').textContent=c[mode+'Cta'];document.querySelector('#hint').innerHTML=c[mode+'Hint'];field.placeholder=c[mode+'Ph'];field.maxLength=mode==='create'?40:6;field.required=mode==='join';field.classList.toggle('code',mode==='join');document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===mode)));document.querySelector('#form-panel').setAttribute('aria-labelledby',mode+'-tab');document.querySelector('#lang-label').textContent=lang.toUpperCase();document.querySelector('.flag').style.background=lang==='fr'?'':'#012169';document.querySelector('.flag').textContent=lang==='fr'?'':'🇬🇧';}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{fields[mode]=field.value;mode=b.dataset.tab;field.value=fields[mode];render();const panel=document.querySelector('.panel');if(!matchMedia('(prefers-reduced-motion: reduce)').matches)panel.animate([{opacity:.4,transform:'translateY(4px)'},{opacity:1,transform:'translateY(0)'}],{duration:220,easing:'ease-out'});}));
field.addEventListener('input',()=>{if(mode==='join')field.value=field.value.toUpperCase();});
document.querySelector('.lang').addEventListener('click',()=>{lang=lang==='fr'?'en':'fr';render();});
document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const toast=document.querySelector('.toast');toast.textContent=copy[lang].demo;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,3500);});
document.querySelectorAll('[role=tab]').forEach(b=>b.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const next=document.querySelector('[data-tab="'+(mode==='create'?'join':'create')+'"]');next.click();next.focus();}}));
render();
</script>
